name: validate-data

# GITHUB_TOKEN only: no personal access tokens, no bot account, no writes.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # PRs check only the records they change; a full run over 962k files is
    # for pushes to develop/main. Measure a real full run before trimming.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 90 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out its merge commit; depth 2 brings the base parent
          # (HEAD^1), which is all the diff needs.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate changed records (PR)
        if: github.event_name == 'pull_request'
        run: python -m app.validate --changed-since HEAD^1
      - name: Validate game catalog (full)
        if: github.event_name != 'pull_request'
        run: python -m app.validate
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
